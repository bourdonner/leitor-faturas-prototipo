<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Abertura do cancelamento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<style>
/* Protótipo da Abertura do cancelamento (Figma "Cancelamento de Cooperado", pág. ↳ Abertura do Cancelamento).
   Casca do Enershare: sidebar 48 px, breadcrumb, folha branca com 3 colunas (passos · formulário · resumo). Stone + oliva da Style Guide. */
:root{
  --bg:#ffffff; --sheet:#ffffff; --panel:#f5f5f4; --panel-2:#fafaf9; --line:#e7e5e4; --line-soft:#eeedeb;
  --ink:#1c1917; --mid:#78716c; --soft:#a8a29e; --brand:#71902f; --brand-ink:#ffffff; --link:#3f6212;
  --warn-bg:#fff7ed; --warn:#c2410c; --bad-bg:#fef2f2; --bad:#b91c1c; --bad-line:#fecaca;
  --scrim:rgba(68,64,60,.8); --shadow:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.1);
  --t-dest:#f43f5e; --t-alert:#f97316; --t-ok:#65a30d; --t-neu:#57534e;
  --display:"Poppins",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,sans-serif; --icons:"Material Symbols Rounded";
}
/* Light por padrão (pedido do Erick): o tema escuro só entra se o visualizador escolher Dark explicitamente. */
:root[data-theme="dark"]{
  --bg:#0c0a09; --sheet:#1c1917; --panel:#292524; --panel-2:#211e1c; --line:#3a3532; --line-soft:#322e2b;
  --ink:#f5f5f4; --mid:#a8a29e; --soft:#78716c; --brand:#84a63a; --brand-ink:#0c0a09; --link:#bef264;
  --warn-bg:#3b1a08; --warn:#fdba74; --bad-bg:#3f0d0d; --bad:#fca5a5; --bad-line:#7f1d1d;
  --scrim:rgba(12,10,9,.75); --shadow:0 10px 15px rgba(0,0,0,.4),0 4px 6px rgba(0,0,0,.3);
  --t-neu:#a8a29e; color-scheme:dark }
*{box-sizing:border-box}
.tbl,.list.grow,.dbg,.menu,.fmenu .ops,.mf-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.ico{font-family:var(--icons);font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 1}
.ico.o{font-variation-settings:"FILL" 0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:block;min-height:100vh}
/* sidebar do Enershare (48 px), igual à do Leitor de Faturas */
.sidebar{position:fixed;left:16px;top:16px;bottom:24px;width:48px;display:flex;flex-direction:column;z-index:20}
.sidebar a{text-decoration:none}
.sidebar .sb-head,.sidebar .sb-foot{padding:8px}
.sidebar .sb-brand{width:32px;height:32px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center}
.sidebar .sb-content{flex:1}
.sidebar .sb-sec{padding:8px;display:flex;flex-direction:column}
.sidebar .sb-item{width:32px;height:36px;border-radius:4px;display:grid;place-items:center;color:var(--ink)}
.sidebar .sb-item.short{height:32px}
.sidebar .sb-item:hover,.sidebar .sb-item.on{background:var(--panel)}
.sidebar .sb-item .mss{font-size:16px}
.sidebar .sb-item.t .mss{color:#44403c}
.sidebar .sb-av{width:32px;height:32px;border-radius:8px;background:linear-gradient(140deg,#c7d9a4,#71902f);display:grid;place-items:center;color:#fff;font:600 12px Inter}
.mss{font-family:"Material Symbols Sharp";font-weight:400;font-style:normal;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none;font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
.sb-tip{position:fixed;left:72px;background:var(--ink);color:var(--sheet);font-size:12px;line-height:16px;padding:6px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60;white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column;gap:12px;margin-left:80px;padding:16px max(24px,env(safe-area-inset-right,0px)) 24px 0;min-height:100vh}
.top{display:flex;align-items:center;gap:8px;height:52px;padding:12px}
.top .rp{display:flex;align-items:center;gap:8px;padding-right:8px}
.top .ibtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink);border:0;background:none;cursor:pointer}
.top .ibtn:hover{background:var(--panel)}
.top .ibtn .ico{font-size:16px;font-variation-settings:"FILL" 0}
.top .vsep{width:1px;height:16px;background:var(--line)}
.top>span:not(.rp):not(.ico){font:500 14px/21px var(--display);color:var(--mid)}
.top .cur{color:var(--brand)!important}
.sheet{background:var(--sheet);border-radius:24px;box-shadow:0 0 40px rgba(0,0,0,.04);padding:24px;display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:24px;align-items:start;flex:1}
/* passos */
.steps{background:var(--panel);border-radius:12px;padding:12px;display:grid;gap:4px;position:sticky;top:12px}
.st{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;width:100%;cursor:default}
.st .n{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--soft);color:var(--mid)}
.st .tt{font-weight:600;font-size:14px}
.st small{display:block;color:var(--mid);font-size:12px;font-weight:400;margin-top:2px}
.st.pend{opacity:.35}
.st.done .n{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.st.done{cursor:pointer}
.st.done:hover{background:var(--line-soft)}
.st.cur{background:var(--brand);color:var(--brand-ink)}
.st.cur .n{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--brand)}
/* formulário */
.form{background:var(--panel-2);border-radius:12px;padding:28px 32px;min-width:0;display:flex;flex-direction:column;gap:20px;position:relative;min-height:calc(100vh - 152px);min-height:calc(100dvh - 152px)}
.q{display:grid;gap:4px}
.q h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.q p{margin:0;color:var(--mid)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lbl{font-size:14px;color:var(--ink);margin-bottom:8px;display:block}
.help{font-size:12px;color:var(--mid);margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--line)}
.opt[aria-checked="true"]{border:1.5px solid var(--brand);padding:13.5px 15.5px}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1px solid var(--soft);background:var(--sheet);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .rd,.mat[aria-checked="true"] .rd{border-color:var(--ink)}
.opt[aria-checked="true"] .rd::after,.mat[aria-checked="true"] .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.mat .rd{width:16px;height:16px;border-radius:50%;border:1px solid var(--soft);background:var(--sheet);flex:none;display:grid;place-items:center}
.opt .t{font-size:15px}
.opt small{display:block;color:var(--mid);font-size:12px}
.field{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);width:100%;text-align:left;cursor:pointer;min-width:0}
.field:hover{border-color:var(--line)}
.field.focus{border:1.5px solid var(--brand);padding:0 15.5px}
.field .v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .v.ph{color:var(--mid)}
.field .ico{font-size:18px;color:var(--mid)}
input.field,textarea.field{cursor:text;font:inherit;color:var(--ink)}
textarea.field{height:96px;padding:12px 16px;resize:vertical;line-height:1.45}
input.field::placeholder,textarea.field::placeholder{color:var(--mid)}
.fwrap{position:relative;min-width:0}
.sbox{display:flex;align-items:center;gap:12px;height:52px;padding:0 4px 0 16px;border-radius:8px;background:color-mix(in srgb,var(--panel) 40%,transparent);border:1px solid var(--panel)}
.sbox:focus-within{border-color:var(--brand)}
.sbox>.ico{font-size:20px;color:var(--ink)}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none;height:100%}
.sbox input::placeholder{color:var(--mid)}
.sbox .sfx{width:44px;height:44px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.sbox .sfx:hover{background:var(--panel)}
.sbox .sfx[aria-pressed="false"]{color:var(--mid)}
.sbox .sfx .ico{font-size:20px}
.tools.nof>:not(.sbox){display:none}
/* menu */
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:30;max-height:340px;overflow:auto}
.menu .srch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft);margin:-4px -4px 4px}
.menu .srch input{border:0;background:none;font:inherit;color:var(--ink);flex:1;outline:none;min-width:0}
.menu .ttl{font-size:12px;font-weight:600;color:var(--ink);padding:8px 10px 4px}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--panel)}
.menu .mi .l{flex:1;min-width:0}
.menu .mi .k{color:var(--mid);font-size:12px}
.menu .mi .ico{font-size:16px;color:var(--mid)}
.menu .back{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
.menu .back button{border:0;background:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.menu .back button:hover{background:var(--panel)}
.menu .back b{font-size:13px}
.menu .empty{padding:12px 10px;color:var(--mid)}
/* temperatura */
.temps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tp{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);cursor:pointer;text-align:left}
.tp:hover{border-color:var(--line)}
.tp[aria-checked="true"]{border:1.5px solid var(--brand);padding:13.5px}
.tp .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tp .c .ico{font-size:20px}
.tp b{font-weight:500;font-size:14px}
.tp small{color:var(--mid);font-size:12px}
.tp.auto{cursor:default;opacity:.6}
/* avisos */
.av{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;font-size:14px}
.av .bdg{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff}
.av .bdg .ico{font-size:16px}
.av b{display:block;font-weight:600}
.av.neu{background:var(--panel);border:1px solid var(--line-soft)} .av.neu .bdg{background:var(--ink);color:var(--sheet)}
.av.warn{background:var(--warn-bg)} .av.warn .bdg{background:var(--t-alert)}
.av.bad{background:var(--bad-bg)} .av.bad .bdg{background:var(--t-dest)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
/* matrícula */
.list{display:grid;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:260px;height:100%;padding:32px 16px}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--panel);display:grid;place-items:center;margin-bottom:4px}
.empty .ei .ico{font-size:28px;color:var(--mid)}
.empty b{font-size:18px;font-weight:600}
.empty .muted{font-size:14px;max-width:360px}
.empty .btn{margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.list.grow:has(> .empty){display:flex}
.list.grow > .empty{flex:1}
tr.emptyrow td{padding:0;border:0}
tr.emptyrow:hover td{background:none}
.mat{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);cursor:pointer;text-align:left;width:100%}
.mat:hover{border-color:var(--line)}
.mat[aria-checked="true"]{border:1.5px solid var(--brand);padding:11.5px 15.5px}
.mat .nm{flex:1;min-width:0}
.mat .nm b{font-weight:500}
.mat .nm small{display:block;color:var(--mid);font-size:12px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line-soft);color:var(--ink);white-space:nowrap}
.tag.pend{background:var(--t-alert);color:#fff}
.tag.emc{background:var(--ink);color:var(--sheet)}
.mat .nm b mark{background:none;color:inherit;font-weight:700}
.mat .nm b{font-weight:400}
.tag.out{background:var(--bad-bg);color:var(--bad)}
/* tabela */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* filtros com a mesma altura da caixa de busca (48 px) */
.tools>.fwrap{flex:1 1 100%}
.tools .fchip,.tools .qchip,.tools .clrall{height:48px}
.tools .fchip{padding:0 12px 0 14px;border-radius:8px}
/* Filtro no padrão Filter da Style Guide (listagem do Leitor): rótulo | separador | valores em pílula | seta */
.flt{position:relative}
.fchip{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--soft)}
.fchip .lb{color:var(--ink)}
.fchip .sp{width:1px;height:16px;background:var(--line)}
.fchip .bd{font-weight:600;font-size:13px;padding:2px 8px;border-radius:4px;background:var(--panel)}
.fchip .ico{font-size:18px;color:var(--mid)}
.flt.on .fchip{border-color:var(--ink)}
.flt.on .fchip .bd{background:var(--ink);color:var(--sheet)}
.fx{border:0;background:none;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;cursor:pointer;margin-left:-4px}
.fx:hover{background:var(--panel)}
.fx .ico{font-size:16px}
.fmenu{position:absolute;left:0;top:calc(100% + 4px);width:280px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;display:flex;flex-direction:column;max-height:360px}
.fmenu .srch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.fmenu .srch input{border:0;background:none;font:inherit;color:var(--ink);flex:1;outline:none;min-width:0}
.fmenu .ops{overflow:auto;padding:4px}
.fmenu .fo{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.fmenu .fo:hover{background:var(--panel)}
.fmenu .fo .l{flex:1}
.fmenu .fo .k{color:var(--mid);font-size:12px}
.fmenu .fo .cb{width:16px;height:16px;border-radius:4px;border:1px solid var(--soft);display:grid;place-items:center}
.fmenu .fo .cb.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.fmenu .fo .cb .ico{font-size:13px}
.fmenu .ft{border-top:1px solid var(--line-soft);padding:6px}
.fmenu .ft button{width:100%;border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:500}
.fmenu .ft button:hover{background:var(--panel)}
.fmenu .ft button:disabled{opacity:.35;cursor:default}
.warnico{font-size:16px;color:var(--t-alert);vertical-align:-3px;margin-left:4px}
.qchip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;white-space:nowrap;font-weight:500}
.qchip .ico{font-size:18px;color:var(--t-alert)}
.qchip:hover{border-color:var(--soft)}
.fat.hasmiss{}
.qchip.on{border-color:var(--t-alert);background:var(--warn-bg)}
.clrall{border:0;background:none;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 8px;border-radius:6px;cursor:pointer}
.clrall:hover{background:var(--panel)}
.clrall .ico{font-size:18px}
.tbl{border:1px solid var(--line-soft);border-radius:12px;overflow:auto}
.tbl.capped{max-height:440px}
/* tabelas crescem até o fim do card (o card ocupa a viewport) e rolam por dentro */
.growcol{flex:1 1 0;min-height:320px;display:flex;flex-direction:column;gap:8px}
.tbl.grow,.list.grow{flex:1 1 0;min-height:220px;overflow:auto}
.list.grow{align-content:start;padding-right:4px}
.sumt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sumt .h{font-size:13px;color:var(--mid);margin-right:4px}
.sumt button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line-soft);background:var(--panel);cursor:pointer;font-size:13px}
.sumt button:hover{border-color:var(--line)}
.sumt button b{font-weight:600}
.sumt button[aria-pressed="true"]{border-color:var(--ink)}
.sumt button .ico{font-size:15px;color:#fff}
.sumt button.st0{background:var(--t-alert);border-color:var(--t-alert);color:#fff}
.tbl table{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-weight:500;color:var(--mid);font-size:13px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-2);z-index:2}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.ck,.tbl th.ck{width:44px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.tbl .uc b{font-weight:500;display:block}
.tbl .uc small{color:var(--mid);font-size:12px}
.tbl td.tp-c{width:auto}
.tp-c > *{max-width:420px}
.tip{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--mid);cursor:help}
.tip .ico{font-size:20px}
.tip:hover,.tip:focus-visible{color:var(--ink)}
.tipb{position:absolute;right:-4px;bottom:calc(100% + 6px);background:var(--ink);color:var(--sheet);font-size:12px;line-height:16px;padding:6px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s;z-index:50}
.tip:hover .tipb,.tip:focus-visible .tipb{opacity:1;transform:none}
table:has(.tp-c) td.uc,table:has(.tp-c) thead th:nth-child(2){width:260px}
.tbl td.tp-c .field{height:44px}
.tbl.grow{border:0;border-radius:0}
.tbl.rv th:nth-child(n+2),.tbl.rv td:nth-child(n+2){text-align:right}
.cap{font-size:12px;color:var(--mid)}
.ucard{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);cursor:pointer}
.ucard:hover{border-color:var(--line)}
.ucard.on{border:1.5px solid var(--brand);padding:11.5px 15.5px}
.ucard input{width:16px;height:16px;accent-color:var(--brand)}
.ucard .nm b{font-weight:500;display:block}
.ucard .nm small{color:var(--mid);font-size:12px}
.fbar .menu{top:auto;bottom:calc(100% + 4px)}

  if(i===0&&S.mat) return M().nome;

/* Date Picker + Calendar (Type=Default) da Style Guide: campo abre o calendário; dias fora de min/max ficam desabilitados */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let calYM=null;
function calendario(id,val,{min,max}){
  const [y,m]=calYM; const first=new Date(Date.UTC(y,m,1)).getUTCDay(), last=new Date(Date.UTC(y,m+1,0)).getUTCDate();

}

  const done=S.done; const vals=preview().map(([ic,l,v])=>{ let para=v; if(done&&l==='WhatsApp e e-mail') para='Enviados'; if(done&&l==='Análise de Saldo') para='AS-2026-00087'; if(l==='Fora de Fornecimento'&&v) para='Sim · '+v; return [ic,l,para]; });
  return `<div class="sec"><h3>${done?'O que o Enershare fez':'O que o Enershare vai fazer ao registrar'}</h3><div class="autos">${vals.map(([ic,l,v])=>`<div class="au"><span class="ico o">${ic}</span><span class="l">${l}</span><span class="de">${DE[l]}</span><span class="ico o arr">arrow_forward</span><span class="pill ${v?TOM[l]:'out'}">${esc(v||'A definir')}</span></div>`).join('')}</div></div>`;
}
function fatBadge(u){ if(!precisaFat(u)) return `<span class="bdg2">Não exigida</span>`; const f=fatOf(u); const miss=MES.filter((m,i)=>f[i]===0), lendo=MES.filter((m,i)=>f[i]===2);
  if(miss.length) return `<span class="bdg2 warn" title="Falta${miss.length>1?'m':''} ${miss.join(', ')}">${miss.length} Faltante${miss.length>1?'s':''}</span>${lendo.length?` <span class="bdg2">${lendo.join(', ')} em leitura</span>`:''}`;
  if(lendo.length) return `<span class="bdg2">${lendo.join(', ')} em leitura</span>`;
  return `<span class="bdg2">Nenhuma Faltante</span>`; }
function stepRevisar(){
  const m=M(); const ucs=ucsPedido();
  const kv=(ic,l,v,w,c)=>`<div class="kvi ${w?'w':''} ${c||''}"><span class="ci"><span class="ico">${ic}</span></span><span><small>${l}</small>${esc(v)}</span></div>`;
  const tipoDe=u=>isTotal()?(isDem()?'Demissão de cooperado':'Cancelamento Total'):S.tipos[u.n];

    :isTotal()?(S.motivo==='Troca de titularidade'?`<div class="av neu"><span class="bdg"><span class="ico">info</span></span><div><b>Não conta como churn se a troca terminar em X dias</b></div></div>`:`<div class="av bad"><span class="bdg"><span class="ico">error</span></span><div><b>Este cancelamento é definido como Churn</b></div></div>`)
    :`<div class="av neu"><span class="bdg"><span class="ico">info</span></span><div><b>Inativação de UC não é churn: a matrícula continua cooperada</b></div></div>`;
  const head=S.done?`<div class="reg"><h2>CAN-2026-00124 registrada</h2><span class="muted">02/10/2026 · 14:35 · por Juliana Prado (CS)</span></div><div class="av neu"><span class="bdg"><span class="ico">info</span></span><div><b>O pedido está Em Cancelamento. ${isRA()?'A Análise de Saldo tem SLA reduzido (RA)':'A Análise de Saldo vence em 06/10/2026 às 12:35'}</b></div></div>${consFim()?av1('neu','info','Negociação do saldo só começa em '+fdata(consFim())+'. Nessa data, o Enershare confere fatura pendente e inadimplência'):''}${isRA()?av1('warn','campaign','RA acompanhado pela Gestão do RA'):''}`
    :`<div class="q"><h2>Revise antes de registrar</h2><p>Ao registrar, o pedido sai de Cancelamento Pendente e vira CAN.</p></div>${aviso}${consFim()?av1('warn','schedule','Consumo de saldo até '+fdata(consFim())+': a Negociação só começa nessa data'):''}${isRA()?av1('warn','campaign','Pedido do Reclame Aqui · SLA reduzido na Análise de Saldo'):''}`;
  const resumo=`<div class="sec"><h3>Resumo do pedido</h3><div class="kv3">${kv('person',m.doc,m.nome)}${kv('home_work','Unidades Consumidoras',m.ucs.length+' ativas')}${kv('select_all','Abrangência',isTotal()?`Cancelamento Total · ${ucs.length} de ${m.ucs.length} UCs`:`${ucs.length} de ${m.ucs.length} UCs`)}</div></div>`;

  const tipo=isTotal()&&!isDem()?`<div class="sec"><h3>Tipo e motivo</h3><div class="kv3">${kv('category','Tipo','Solicitação do Cooperado',false,'w2')}${kv('event','Data do pedido',S.data.split('-').reverse().join('/'))}${kv('help','Motivo',S.motivo)}${kv('device_thermostat','Temperatura',S.temp)}${kv('call','Meio de contato',S.meio)}${isRA()?kv('campaign','Reclame Aqui','Pedido do RA · SLA reduzido'):''}${S.ra?kv('link','Link do Reclame Aqui',S.ra):''}${S.desc?kv('notes','Descrição',S.desc,true):''}</div></div>`
    :isDem()?`<div class="sec"><h3>Tipo e origem</h3><div class="kv3">${kv('category','Tipo','Demissão de cooperado')}${kv('confirmation_number','Ticket de origem','TK-04175 · Faturamento Pendente')}${kv('help','Motivo','Vem do ticket: 7 de 7 tentativas sem retorno')}${kv('call','Meio de contato','Demissão do Cooperado · automático')}</div></div>`:'';
  const acts=S.done?`<div class="acts"><span></span><button class="btn pri" onclick="toast('Detalhe do cancelamento','Esta tela ainda não está no protótipo.')">Ver cancelamento</button></div>`
    :`<div class="acts"><button class="btn" data-prev>Voltar</button><button class="btn pri" data-register>${isDem()?'Registrar demissão':isTotal()?'Registrar CAN':'Registrar inativação'}</button></div>`;
  return head+resumo+tabela+tipo+autosec()+acts;
}
/* barra flutuante: anima só quando abre ou fecha (não a cada render) */
let fbWas=null;
function fbarAnim(){ const form=$('#form'), fb=form.querySelector('.fbar'); form.classList.toggle('has-fbar',!!fb); const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(fb&&!fbWas&&!calm) fb.classList.add('in');
  if(!fb&&fbWas&&!calm){ const g=document.createElement('div'); g.innerHTML=fbWas; const el=g.firstElementChild; el.classList.remove('in'); el.classList.add('out'); el.setAttribute('aria-hidden','true'); el.querySelectorAll('.menu').forEach(m=>m.remove()); form.appendChild(el); setTimeout(()=>el.remove(),240); }
  fbWas=fb?fb.outerHTML:null; }
function render(){
  renderSteps();
  $('#form').innerHTML=[stepMatricula,stepAbr,stepTipo,stepFaturas,stepRevisar][S.step]();
  fbarAnim();
  { const c=$('#form .cal'), box=c&&c.closest('.tbl'); if(c&&box&&c.getBoundingClientRect().bottom>box.getBoundingClientRect().bottom) c.classList.add('up'); }
  const wide=S.step===4; document.querySelector('.sheet').classList.toggle('wide',wide); if(wide) $('#right').innerHTML=''; else renderRight();
  const mb=$('#mbusca'); if(mb&&S.menu==='motivo'){ mb.focus(); mb.setSelectionRange(mb.value.length,mb.value.length); }
  renderDebug();
}

/* ---------- upload (padrão Nova fatura do Leitor) ---------- */
let up=null;
function openUpload(uc,mes){ up={uc,mes,file:null,state:'empty'}; renderModal(); }
function renderModal(){
  if(!up){ $('#modal').innerHTML=''; return; }
  const u=ucsPedido().find(x=>x.n===up.uc);
  const fi=up.file?`<div class="fi"><span class="ty"><span class="ico o">${/pdf$/i.test(up.file.name)?'picture_as_pdf':'image'}</span></span><span class="nm"><b>${esc(up.file.name)}</b><small>${up.state==='sending'?'Enviando…':'Aguardando envio'} · ${up.file.size}</small>${up.state==='sending'?'<div class="bar"><i id="pbar"></i></div>':''}</span>${up.state==='sending'?'':'<button class="btn ghost" data-rmfile aria-label="Remover arquivo" style="width:32px;padding:0;justify-content:center"><span class="ico o" style="font-size:18px">close</span></button>'}</div>`:'';
  $('#modal').innerHTML=`<div class="scrim" data-scrim><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><button class="x" data-closeup aria-label="Fechar"><span class="ico o" style="font-size:18px">close</span></button>
   <div class="hd"><h3 id="dlgt">Incluir fatura</h3><p>Fatura de ${MES[up.mes]} da UC ${u.n}. Envie em PDF ou imagem; ela segue para o Leitor de Faturas.</p></div>
   <div class="bd">${fi}<label class="drop" id="drop"><span class="ico o">upload_file</span>${up.file?'Arraste outro arquivo ou':'Arraste a fatura aqui ou'} <span class="btn link">escolha no computador</span><input type="file" id="upf" accept=".pdf,.jpg,.jpeg,.png,.webp" class="sr"></label></div>
   <div class="ft"><button class="btn" data-closeup>Cancelar</button><button class="btn pri" data-sendup ${up.file&&up.state!=='sending'?'':'disabled'}>Enviar fatura</button></div></div></div>`;
  const inp=$('#upf'); inp.onchange=e=>{ const f=e.target.files[0]; if(f){ up.file={name:f.name,size:(f.size/1048576).toFixed(1).replace('.',',')+' MB'}; renderModal(); } };
  const d=$('#drop'); d.ondragover=e=>{e.preventDefault(); d.classList.add('over');}; d.ondragleave=()=>d.classList.remove('over'); d.ondrop=e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f){ up.file={name:f.name,size:(f.size/1048576).toFixed(1).replace('.',',')+' MB'}; renderModal(); } };
  d.onclick=e=>{ if(!up.file&&e.target===d){ /* sem arquivo: o label já abre o seletor */ } };
}
function sendUpload(){ up.state='sending'; renderModal(); requestAnimationFrame(()=>{ const b=$('#pbar'); if(b) b.style.width='100%'; });
  setTimeout(()=>{ const u=ucsPedido().find(x=>x.n===up.uc); const f=[...fatOf(u)]; f[up.mes]=2; S.fat[u.n]=f; ev('Fatura '+MES[up.mes]+' da UC '+u.n+' enviada ao Leitor (status: lendo)'); toast('Fatura enviada para o Leitor',`${MES[up.mes]} da UC ${u.n}. Ela entra no pedido assim que a leitura terminar.`); up=null; renderModal(); render(); },1000); }

  const tot=S.abr?isTotal():null;
  if(S.done) return {n:NODES.status,next:NODES.analise};
  if(S.step===0) return {n:NODES.buscar,next:NODES.gw};
  if(S.step===1) return {n:tot===null?NODES.gw:tot?NODES.titular:NODES.uc,next:tot===null?null:tot?NODES.tipoT:NODES.tipoU};
  if(S.step===2) return {n:tot?NODES.tipoT:NODES.tipoU,next:NODES.preencher};
  if(S.step===3) return exigeFat()?{n:NODES.validar,next:NODES.buscar3}:{n:NODES.gwFat,next:NODES.confT};
  return {n:exigeFat()?NODES.confU:NODES.confT,next:exigeFat()?NODES.validar:NODES.protocolo};
}
const MAP_W=8400, MAP_H=Math.round(8400*9850/17878);
let lastMM=null;
function miniMapa(){
  const p=mapaPos(); const W=Math.max(300,(($('#dbg')&&$('#dbg').clientWidth)||680)-34), H=460; const z=.55;
  const cx=p.n.x*MAP_W*z, cy=p.n.y*MAP_H*z;
  const tx=Math.min(0,Math.max(W-MAP_W*z,W/2-cx)), ty=Math.min(0,Math.max(H-MAP_H*z,H/2-cy));
  const to=`translate(${tx}px,${ty}px)`, from=lastMM||to; lastMM=to;
  return `<div class="mm" style="height:${H}px"><div class="mm-in" data-to="${to}" style="width:${MAP_W*z}px;height:${MAP_H*z}px;transform:${from}"><img src="${MAPA}" alt="Diagrama BPMN do processo de cancelamento" width="${Math.round(MAP_W*z)}" height="${Math.round(MAP_H*z)}">${pin(p.n,z,'Você está aqui')}${p.next?pin(p.next,z,'Próximo',1):''}</div></div>`;
}
function pin(n,z,label,ghost){ const w=Math.round(80*z), h=Math.round(60*z); return `<span class="pin ${ghost?'ghost':''}" style="left:${n.x*MAP_W*z}px;top:${n.y*MAP_H*z}px;width:${w}px;height:${h}px"><i></i><b>${label}</b></span>`; }

  add('UCs no pedido',n?(isTotal()?n+' (todas)':n+' de '+m.ucs.length):null,{req:1,ref:'RF08 / RF10'});
  if(S.abr&&isTotal()){
    add('Origem',S.origem?(S.origem==='dem'?'Demissão de cooperado':'Solicitação do Cooperado'):null,{req:1,ref:'Abertura 20/10'});
    if(S.origem==='dem'){ add('Meio de contato','Demissão do Cooperado',{auto:1,ref:'RF12'}); add('Motivo','vem do ticket TK-04175',{auto:1,ref:'Reunião 20/10'}); }

  }
  if(S.abr&&!isTotal()){ const f=ucs.filter(u=>S.tipos[u.n]).length; add('Tipo de negociação',n?f+'/'+n+' UCs':null,{req:1,ref:'Abertura 20/10',full:f===n&&n>0}); }
  if(S.step>=3||S.done){ const fu=fatUCs(); const miss=fu.filter(u=>fatOf(u).includes(0)).length, lendo=fu.filter(u=>fatOf(u).includes(2)).length; if(!fu.length) add('3 últimas faturas','não se aplica a este tipo',{auto:1,ref:'fluxo v4'}); else add('3 últimas faturas',miss?null:(lendo?lendo+' lendo no Leitor':'todas presentes'),{req:1,ref:'fluxo v4 · bloqueia'}); }
  if(m) ['Nome do agente de atendimento','Dados do cooperado (nome, telefone, e-mail, endereço)','Instalação (UCs)','Carteira do cooperado','Tipo de registro da conta (PF/PJ)','Livro','Página','Matrícula','Status','Data de adesão','Demanda de consumo','Economia cadastrada (%)','Concessionária','Grupo de relacionamento'].forEach(k=>add(k,'Enershare preenche',{auto:1,ref:'fluxo v4'}));
  return F;
}
const snap=()=>Object.fromEntries(fields().map(f=>[f.k,f.v]));
function estado(f){
  if(f.auto) return ['automático','auto'];
  const filled=f.full!==undefined?f.full:f.v!=null;
  if(!filled) return f.req?(f.gate===0?['pendente · tela não exige','gap']:['pendente','pend']):['vazio (opcional)','auto'];
  if(S.saved&&S.saved[f.k]===f.v) return ['salvo','salvo'];
  return ['preenchido · não salvo','nsalvo'];
}
function caminho(){
  if(!S.abr) return {nome:'A definir: escolha a abrangência',passos:[]};
  const reg={t:'Registro da CAN',d:'CS · este formulário'};
  if(isTotal()&&S.origem==='dem') return {nome:'Demissão do Cooperado (§40)',passos:[reg,{t:'Análise de Saldo',d:'ticket automático · 17 h úteis'},{t:'Fatura do saldo final',d:'sem negociação'},{t:'Cobrança ativada',d:'só para a fatura final'}]};
  if(isTotal()) return {nome:'Cancelamento Total → Negociação (§38)',passos:[reg,{t:'Análise de Saldo',d:'ticket automático · 17 h úteis'},{t:'Negociação do Saldo',d:'equipe própria + títulos vencidos (§45, §47)'},{t:'Fatura do saldo final'},{t:'Financeiro'}]};
  const tipos=[...new Set(ucsPedido().map(u=>S.tipos[u.n]).filter(Boolean))];
  const neg=tipos.filter(t=>!/Realocação|Consumo/.test(t)), rea=tipos.filter(t=>/Realocação|Consumo/.test(t));
  const p=[reg,{t:'Análise de Saldo',d:'um ticket, cada UC com seu saldo'}];
  if(neg.length) p.push({t:'Negociação do Saldo',d:neg.join(', ')});
  if(rea.length) p.push({t:'Realocação / Compensação',d:rea.join(', ')+' · pode liberar o faturamento até uma data (§46)'});
  if(!tipos.length) p.push({t:'Destino por tipo',d:'defina os tipos de negociação'});
  p.push({t:'Fatura do saldo final'},{t:'Financeiro'});
  return {nome:'Inativação de UC · destino por tipo (§37)',passos:p};
}

function regras(){
  const r=[]; const m=M(); if(!S.abr) return r;
  if(isTotal()) r.push(['Todas as UCs entram, com um formulário só','RF08 / RF09']);
  if(S.abr==='ucs'&&m&&S.sel.size===m.ucs.length) r.push(['Marcou todas as UCs: vira Cancelamento Total da matrícula','Abertura 20/10']);
  if(S.reg) r.push(['Registro gerado: pedido salvo como Cancelamento Pendente (rascunho)','Abertura 20/10']);
  if(isDem()) r.push(['Demissão: sem motivo, sem formulário e sem temperatura; meio de contato automático','RF12 · Erick 21/10']);
  if(isDem()) r.push(['O PRD preenche Temperatura = Operacional na Demissão; aqui ela não existe','RF11 × decisão 21/10','gap']);
  if(isTotal()&&!isDem()&&S.origem) r.push([S.motivo==='Troca de titularidade'?'Não conta como churn se a troca terminar em X dias':'Conta como churn','Reunião 20/10']);
  if(isDem()) r.push(['Demissão no churn: ainda em aberto','pendente de decisão']);
  if(!isTotal()) r.push(['Inativação de UC não é churn','Reunião 20/10']);
  if(ucsPedido().some(u=>/Troca de Titularidade/.test(S.tipos[u.n]||''))) r.push(['Troca de titularidade com prazo de X dias (Consumo de Saldo: X meses)','Reunião 20/10']);
  if((S.step>=3||S.done)&&exigeFat()) r.push(['Confere as 3 faturas das UCs com Mudança de Endereço, Troca ou Parcial com Realocação; sem elas o avanço fica bloqueado','fluxo v4 · Erick 22/10']);
  if(consUCs().length) r.push(['Consumo de saldo por UC com data de término; Negociação só na data; na data, conferir fatura pendente e inadimplência','Notas do Will 10/26']);
  if(isRA()) r.push(['RA: mesmo fluxo do cancelamento, SLA reduzido e fila da Gestão do RA (prazo ainda não definido)','Notas do Will 10/26']);
  if((S.step>=3||S.done)&&fatUCs().some(u=>fatOf(u).includes(0))) r.push(['Falta fatura: Continuar bloqueado até incluir','fluxo v4']);
  if((S.step>=3||S.done)&&S.abr&&!exigeFat()) r.push(['Este tipo não confere faturas: o passo Faturas é pulado','fluxo v4 · Erick 22/10']);
  if(isTotal()&&S.origem==='sol') r.push(['Data do pedido nunca depois de hoje; Descrição obrigatória','Erick 27/10']);
  return r;
}
