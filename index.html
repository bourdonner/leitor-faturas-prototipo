<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de Faturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
  :root{--ink:#1c1917;--mid:#78716c;--s400:#a8a29e;--border:#d6d3d1;--s200:#e7e5e4;--s100:#f5f5f4;--s50:#fafaf9;--white:#fff;--brand:#71902f;--success:#5ea500;--alert:#f97316;--danger:#ef4444}
  .ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:18px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20;user-select:none}
  .ms.f{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--s100);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .app{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
  .side{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;position:sticky;top:0;height:100vh}
  .side .logo{width:32px;height:32px;display:grid;place-items:center;color:var(--brand);margin-bottom:12px}
  .side a{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
  .side a.on{background:var(--s200)}
  .side .sp{flex:1}
  .side .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#9bbf5a,#71902f)}
  .main{display:flex;flex-direction:column;min-width:0;padding:16px 16px 16px 0}
  .top{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;color:var(--mid)}
  .top b{color:var(--brand);font-weight:500}
  .sheet{flex:1;background:var(--white);border-radius:24px;margin-top:12px;padding:28px 40px 24px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .head{display:flex;align-items:flex-start}
  .head h1{font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:24px;color:var(--brand);margin:0 0 6px}
  .head p{margin:0;color:var(--mid);font-size:13px}
  .head .sp{flex:1}
  .sq{width:40px;height:40px;border-radius:10px;background:var(--s100);display:grid;place-items:center}
  .sq:hover{background:var(--s200)}
  .tools{display:flex;gap:16px;margin-top:28px}
  .search{flex:1;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:10px;background:var(--s100)}
  .search input{flex:1;border:0;background:transparent;font:inherit;outline:none;color:var(--ink)}
  .search input::placeholder{color:var(--mid)}
  .filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .fchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--mid);display:inline-flex;align-items:center;gap:6px}
  .fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .fchip b{font-weight:600}
  .tbl{margin-top:20px;border:1px solid var(--border);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{font-weight:400;color:var(--mid);font-size:13px;text-align:left;padding:14px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th button{display:inline-flex;align-items:center;gap:4px;color:var(--mid)}
  td{padding:0 12px;height:56px;border-bottom:1px solid var(--s200);font-size:13px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer;transition:background .15s}
  tbody tr:hover{background:var(--s50)}
  tbody tr.demo td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
  .ck{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:4px;display:inline-block;vertical-align:middle}
  .st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff}
  .st.alert{background:var(--alert)} .st.danger{background:var(--danger)} .st.dark{background:var(--ink)} .st.ok{background:var(--success)} .st.grey{background:var(--mid)}
  .st.soft{background:var(--s100);color:var(--ink);border:1px solid var(--s200)}
  .tit{display:inline-flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--s50)}
  .tit .ic{width:18px;height:18px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center}
  .muted{color:var(--mid)}
  .foot{display:flex;align-items:center;gap:24px;margin-top:20px;color:var(--mid);font-size:13px}
  .foot .sp{flex:1}
  .foot .rows{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
  .sel{height:36px;min-width:60px;padding:0 10px;border:1px solid var(--s200);border-radius:8px;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink)}
  .pg{display:flex;align-items:center;gap:6px}
  .pg button{width:30px;height:30px;border-radius:8px;border:1px solid var(--s200);display:grid;place-items:center}
  .pg button:disabled{opacity:.35;cursor:default}
  .empty{padding:48px;text-align:center;color:var(--mid)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:50;font-size:13px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .note{position:fixed;right:16px;top:12px;font-size:11px;color:var(--mid);background:var(--white);border:1px solid var(--s200);padding:4px 8px;border-radius:999px;z-index:40}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Navegação">
    <div class="logo" aria-hidden="true"><span class="ms f" style="font-size:22px">bolt</span></div>
    <a href="#" aria-label="Início"><span class="ms f">home</span></a>
    <a href="index.html" class="on" aria-label="Leitor de faturas"><span class="ms f">description</span></a>
    <a href="#" aria-label="Financeiro"><span class="ms f">payments</span></a>
    <a href="#" aria-label="Consumidores"><span class="ms f">group</span></a>
    <div class="sp"></div><div class="av" aria-hidden="true"></div>
  </nav>
  <div class="main">
    <div class="top"><span class="ms" style="font-size:16px">dock_to_right</span><span>Consumidores &nbsp;›&nbsp; <b>Leitor de Faturas</b></span></div>
    <section class="sheet">
      <div class="head">
        <div><h1>Leitor de Faturas</h1><p>Todas as faturas enviadas para leitura</p></div>
        <span class="sp"></span>
        <button class="sq" aria-label="Enviar fatura" id="add"><span class="ms">add</span></button>
      </div>
      <div class="tools">
        <label class="search"><span class="ms">search</span><input id="q" placeholder="Buscar por titular, UC ou nome do arquivo" autocomplete="off"></label>
        <button class="sq" style="width:48px;height:48px" aria-label="Colunas" id="cols"><span class="ms">view_column</span></button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="tbl">
        <table>
          <thead><tr>
            <th style="width:44px"><span class="ck"></span></th>
            <th><button id="sortSt">Situação <span class="ms" style="font-size:16px">swap_vert</span></button></th>
            <th>Pendências</th><th>Titular</th><th>UC</th><th>Referência</th><th>Responsável</th>
            <th><button id="sortDt">Recebida em <span class="ms" style="font-size:16px">swap_vert</span></button></th>
            <th style="width:48px"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="foot">
        <span id="count"></span><span class="sp"></span>
        <span class="rows">Linhas por página <span class="sel">12 <span class="ms" style="font-size:16px">unfold_more</span></span></span>
        <span class="rows" style="font-weight:500">Página 1 de 38</span>
        <span class="pg"><button disabled aria-label="Primeira"><span class="ms" style="font-size:16px">first_page</span></button><button disabled aria-label="Anterior"><span class="ms" style="font-size:16px">chevron_left</span></button><button aria-label="Próxima"><span class="ms" style="font-size:16px">chevron_right</span></button><button aria-label="Última"><span class="ms" style="font-size:16px">last_page</span></button></span>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="note">Protótipo · dados fictícios</div>
<script>
const ST = {'Para revisar':'alert','Erro na leitura':'danger','Erro no faturamento':'danger','Em revisão':'dark','Faturando':'soft','Lendo fatura':'soft','Sem pendências':'ok','Faturada':'ok','Recusada':'grey','Duplicada':'grey'};
const GROUP = {'Precisa de você':['Para revisar','Erro na leitura','Erro no faturamento','Sem pendências'],'Em andamento':['Lendo fatura','Em revisão','Faturando'],'Encerradas':['Faturada','Recusada','Duplicada']};
const DATA = [
  ['Para revisar','3 pendências','Padaria Estrela do Sul Ltda','3014567890 · Luz do Vale','mar/2025','Sem responsável','13/03/2025',true],
  ['Lendo fatura','2ª tentativa','Não identificado','—','—','Sem responsável','13/03/2025'],
  ['Erro na leitura','Arquivo ilegível','Não identificado','—','—','Sem responsável','13/03/2025'],
  ['Para revisar','1 pendência','Mariana Alves Costa','3000451278 · Luz do Vale','mar/2025','Ana Souza','13/03/2025'],
  ['Sem pendências','Pronta para aprovar','Quantum Soluções Ltda','4501238876 · Força Sul','mar/2025','Ana Souza','12/03/2025'],
  ['Em revisão','Outra pessoa revisando','NovaTech Comércio','6002231145 · Força Sul','mar/2025','Bruno Lima','12/03/2025'],
  ['Erro no faturamento','UC sem contrato','Solaris Energias Renováveis','7045512309 · Energia Serra','fev/2025','Bruno Lima','12/03/2025'],
  ['Faturando','—','Stellaris Indústria','8801234567 · Rio Claro Energia','fev/2025','Bruno Lima','11/03/2025'],
  ['Faturada','—','Apex Comércio de Alimentos','5509871234 · Luz do Vale','fev/2025','Bruno Lima','10/03/2025'],
  ['Faturada','—','Zenith Serviços Médicos','3104567890 · Energia Serra','fev/2025','Ana Souza','09/03/2025'],
  ['Recusada','Não é fatura','Carlos Pereira','—','—','Bruno Lima','08/03/2025'],
  ['Duplicada','Já existe fev/2025','Veridian Elétrica','7712340987 · Força Sul','fev/2025','Bruno Lima','07/03/2025']
];
let filter='Todas', q='', asc=false, sortBy='dt';
const $=s=>document.querySelector(s);
const toDate=s=>s.split('/').reverse().join('');
function renderFilters(){
  const counts = {Todas:DATA.length}; for (const [g,list] of Object.entries(GROUP)) counts[g]=DATA.filter(r=>list.includes(r[0])).length;
  $('#filters').innerHTML = Object.entries(counts).map(([k,v])=>`<button class="fchip ${filter===k?'on':''}" data-f="${k}">${k}</button>`).join('');
}
function render(){
  let rows = DATA.filter(r=> filter==='Todas' || GROUP[filter].includes(r[0]));
  if (q) rows = rows.filter(r=>(r[2]+' '+r[3]).toLowerCase().includes(q));
  rows = rows.slice().sort((a,b)=> sortBy==='dt' ? (asc?1:-1)*toDate(a[6]).localeCompare(toDate(b[6])) : (asc?1:-1)*a[0].localeCompare(b[0]));
  $('#rows').innerHTML = rows.length ? rows.map(r=>`<tr class="${r[7]?'demo':''}" data-demo="${r[7]?1:0}" tabindex="0">
    <td><span class="ck"></span></td>
    <td><span class="st ${ST[r[0]]}">${r[0]}</span></td>
    <td class="${r[1]==='—'?'muted':''}">${r[1]}</td>
    <td><span class="tit"><span class="ic"><span class="ms f" style="font-size:12px">bolt</span></span>${r[2]}</span></td>
    <td class="${r[3]==='—'?'muted':''}">${r[3]}</td><td class="${r[4]==='—'?'muted':''}">${r[4]}</td>
    <td class="${r[5]==='Sem responsável'?'muted':''}">${r[5]}</td><td>${r[6]}</td>
    <td><span class="ms muted">more_horiz</span></td></tr>`).join('') : `<tr><td colspan="9" class="empty">Nenhuma fatura encontrada para “${q}”.</td></tr>`;
  $('#count').textContent = `${filter==='Todas'?454:rows.length} faturas`;
  renderFilters();
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
$('#rows').addEventListener('click', e=>{ const tr=e.target.closest('tr[data-demo]'); if(!tr) return; if(tr.dataset.demo==='1') location.href='detalhe.html'; else toast('No protótipo, só a fatura da Padaria Estrela do Sul abre o detalhe.'); });
$('#rows').addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.closest('tr')?.click(); });
$('#filters').addEventListener('click', e=>{ const b=e.target.closest('[data-f]'); if(b){ filter=b.dataset.f; render(); } });
$('#q').addEventListener('input', e=>{ q=e.target.value.trim().toLowerCase(); render(); });
$('#sortDt').onclick=()=>{ sortBy='dt'; asc=!asc; render(); };
$('#sortSt').onclick=()=>{ sortBy='st'; asc=!asc; render(); };
$('#add').onclick=()=>toast('Envio de fatura fora do escopo do protótipo.');
$('#cols').onclick=()=>toast('Seleção de colunas fora do escopo do protótipo.');
render();
</script>
</body>
</html>
