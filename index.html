<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de Faturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&family=Geist:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<style>
  :root{
    --ink:#1c1917; --ink2:#0c0a09; --ink3:#44403c; --mid:#78716c; --border:#d6d3d1; --s100:#f5f5f4; --s50:#fafaf9; --panel:#fafafa; --white:#fff;
    --brand:#71902f; --success:#65a30d; --alert:#f97316; --danger:#f43f5e;
    --pop:0 10px 15px rgba(0,0,0,.10),0 4px 6px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--white);font-size:14px;line-height:24px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .msr,.mss{font-weight:400;font-style:normal;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none;font-size:16px}
  .msr{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20}
  .mss{font-family:"Material Symbols Sharp";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20}
  .fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}

  /* ===== Enershare Sidebar (48px) ===== */
  .sidebar{position:fixed;left:16px;top:16px;bottom:24px;width:48px;display:flex;flex-direction:column;z-index:20}
  .sidebar a{text-decoration:none}
  .sidebar .sb-head,.sidebar .sb-foot{padding:8px}
  .sidebar .sb-brand{width:32px;height:32px;border-radius:8px;background:var(--s50);display:grid;place-items:center}
  .sidebar .sb-content{flex:1}
  .sidebar .sb-sec{padding:8px;display:flex;flex-direction:column}
  .sidebar .sb-item{width:32px;height:36px;border-radius:4px;display:grid;place-items:center;color:var(--ink)}
  .sidebar .sb-item.short{height:32px}
  .sidebar .sb-item:hover{background:var(--s100)}
  .sidebar .sb-item.on{background:var(--s100)}
  .sidebar .sb-item .mss{font-size:16px}
  .sidebar .sb-item.t .mss{color:var(--ink3)}
  .sidebar .sb-av{width:32px;height:32px;border-radius:8px;background:linear-gradient(140deg,#c7d9a4,#71902f);display:grid;place-items:center;color:#fff;font:600 12px Inter}
  .sb-tip{position:fixed;left:72px;background:var(--ink);color:#fff;font-size:12px;line-height:16px;padding:6px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60;white-space:nowrap}

  /* ===== página ===== */
  .page{margin-left:80px;padding:16px 24px 24px 0;display:flex;flex-direction:column;gap:12px;min-height:100vh}
  .topbar{height:52px;padding:12px;display:flex;align-items:center}
  .crumb{display:flex;align-items:center;gap:8px}
  .crumb .rp{display:flex;align-items:center;gap:8px;padding-right:8px}
  .ibtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)}
  .ibtn:hover{background:var(--s100)}
  .vsep{width:1px;height:16px;background:var(--border)}
  .crumb a,.crumb span.cur{font:500 14px/21px Poppins,sans-serif;text-decoration:none}
  .crumb a{color:var(--mid)} .crumb a:hover{color:var(--ink)}
  .crumb .cur{color:var(--brand)}
  .card{flex:1;background:var(--white);border-radius:24px;box-shadow:0 0 40px rgba(0,0,0,.04);padding:32px 56px 56px;display:flex;flex-direction:column;gap:32px}
  .head{display:flex;gap:24px}
  .head .tc{flex:1}
  .head h1{margin:4px 0 0;font:600 24px/32px Poppins,sans-serif;color:var(--brand)}
  .head p{margin:4px 0 0;font:500 14px/24px Geist,Inter,sans-serif;color:var(--mid)}
  .sqbtn{width:40px;height:40px;border-radius:8px;background:var(--s50);display:grid;place-items:center;color:var(--ink2)}
  .sqbtn:hover{background:var(--s100)}
  .body{display:flex;flex-direction:column;gap:24px;flex:1}
  /* busca */
  .tools{display:flex;gap:24px}
  .field{height:52px;border-radius:8px;background:rgba(245,245,244,.4);border:1px solid var(--s100);padding:4px;display:flex;align-items:center;gap:8px}
  .field.grow{flex:1}
  .fbtn{width:44px;height:44px;padding:4px;display:grid;place-items:center}
  .fbtn span{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--ink)}
  button.fbtn:hover span{background:var(--s100)}
  .fbtn .msr{font-size:20px}
  .field input{flex:1;border:0;background:transparent;font:400 14px/24px Inter;color:var(--ink);outline:none;min-width:0}
  .field input::placeholder{color:var(--mid)}
  .field:focus-within{border-color:var(--border)}
  /* tabela */
  .table{border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .tr{display:grid;grid-template-columns:48px 200px 220px minmax(220px,1fr) 240px 140px 220px 160px 64px}
  .th{height:48px;border-bottom:1px solid var(--border)}
  .th > div{display:flex;align-items:center;padding:12px 16px;font:500 14px/21px Poppins,sans-serif;color:var(--mid);white-space:nowrap}
  .th > div.sort{padding:4px 16px 4px 0}
  .th .sbtn{display:inline-flex;align-items:center;gap:4px;height:37px;padding:8px 12px;border-radius:6px;color:var(--mid);font:500 14px/21px Poppins,sans-serif}
  .th .sbtn .w{padding:0 4px}
  .th .sbtn:hover{background:var(--s100)}
  .th .sbtn.on{color:var(--ink)}
  .th .sbtn .msr{font-size:16px}
  .th > div.ck,.td.ck{padding:0 16px;justify-content:flex-start}
  .th > div.act{padding:4px 16px 4px 0;justify-content:flex-end}
  .th .colbtn{width:28px;height:28px;border-radius:6px;background:var(--s50);display:grid;place-items:center}
  .th .colbtn:hover{background:var(--s100)}
  .row{height:56px;cursor:pointer}
  .row .td{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);font:400 14px/24px Inter;color:var(--ink);white-space:nowrap;overflow:hidden;min-width:0}
  .row:last-child .td{border-bottom:0}
  .row:hover .td{background:var(--s50)}
  .row.sel .td{background:#f7fee7}
  .row .td.act{padding:0 16px;justify-content:center}
  .cb{width:16px;height:16px;border:1px solid var(--ink);border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;cursor:pointer}
  .cb.on{background:var(--ink)}
  .cb .mss{font-size:14px}
  .badge{display:inline-flex;align-items:center;height:22px;padding:2px 10px;border-radius:9999px;font:600 12px/18px Poppins,sans-serif;color:var(--s50)}
  .b-alert{background:var(--alert)} .b-danger{background:var(--danger)} .b-dark{background:var(--ink)} .b-ok{background:var(--success)} .b-grey{background:var(--mid)}
  .b-soft{background:var(--s100);color:var(--ink)}
  .ent{display:flex;align-items:center;gap:8px;height:40px;max-width:100%;padding:4px 8px;border-radius:8px;background:rgba(245,245,244,.4);border:1px solid var(--s50);min-width:0;flex:1}
  .ent .bb{width:20px;height:20px;border-radius:9999px;background:var(--success);display:grid;place-items:center;color:var(--s50);flex:none}
  .ent .bb .msr{font-size:12px}
  .ent .t{overflow:hidden;text-overflow:ellipsis}
  .more{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)}
  .more:hover,.more.open{background:var(--s100)}
  /* paginação */
  .pag{display:flex;align-items:center;gap:64px;padding-top:16px}
  .pag .info{flex:1;color:var(--mid)}
  .pag .right{display:flex;align-items:center;gap:32px}
  .pag .pc{display:flex;align-items:center;gap:8px;font:500 14px/21px Poppins,sans-serif;color:var(--ink)}
  .combo{height:37px;padding:8px 12px;border-radius:6px;border:1px solid var(--s100);background:#fff;display:flex;align-items:center;gap:16px;font:500 14px/21px Poppins,sans-serif}
  .pages{font:500 14px/21px Poppins,sans-serif}
  .pbtns{display:flex;gap:8px}
  .pbtns button{width:32px;height:32px;border-radius:6px;border:1px solid var(--s100);background:#fff;display:grid;place-items:center;color:var(--ink2)}
  .pbtns button:hover:not(:disabled){background:var(--s100)}
  .pbtns button:disabled{opacity:.4;cursor:default}
  /* estados */
  .state{flex:1;min-height:560px;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .state p{margin:0;font:400 16px/19px Inter;color:#595959}
  .state.loading{flex-direction:row;gap:8px}
  .state.loading p{font-size:14px;color:var(--mid)}
  .spin{animation:spin .9s linear infinite;color:var(--mid)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* menus */
  .dd{position:absolute;z-index:40;width:224px;border-radius:6px;border:1px solid var(--s50);box-shadow:var(--pop);overflow:hidden}
  .dd .sec{background:#fff;border:1px solid var(--s100);padding:4px;display:flex;flex-direction:column}
  .dd button{height:36px;border-radius:4px;padding:6px 8px 6px 32px;text-align:left;font:400 14px/24px Inter;color:var(--ink2);position:relative}
  .dd button:hover,.dd button:focus-visible{background:var(--s100);outline:none}
  .dd button .mss{position:absolute;left:8px;top:10px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(68,64,60,.8);display:none;align-items:center;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .dlg{width:560px;background:#fff;border:1px solid var(--s100);border-radius:8px;box-shadow:var(--pop);position:relative}
  .dlg .dh{padding:24px;display:flex;flex-direction:column;gap:6px}
  .dlg h2{margin:0;font:600 24px/32px Poppins,sans-serif;color:var(--brand)}
  .dlg .dh p{margin:0;color:var(--mid)}
  .dlg .db{padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}
  .dlg label{display:flex;flex-direction:column;gap:8px;color:var(--ink2)}
  .dlg .sel{position:relative}
  .dlg .sel:has(.cs) > .mss{display:none}
  .dlg select,.dlg textarea{width:100%;font:400 14px/24px Inter;color:var(--ink);background:var(--s50);border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none}
  .dlg select{height:40px;appearance:none;padding-right:40px}
  .dlg select:invalid{color:var(--mid)}
  .dlg .sel .mss{position:absolute;right:12px;bottom:12px;pointer-events:none}
  .dlg textarea{height:80px;resize:none}
  .dlg textarea::placeholder{color:var(--mid)}
  .dlg select:focus,.dlg textarea:focus{border-color:var(--ink)}
  .dlg .df{padding:0 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .btn{height:40px;border-radius:6px;padding:8px 12px;font:400 14px/24px Inter}
  .btn.out{border:1px solid var(--border);background:#fff;color:var(--ink)}
  .btn.out:hover{background:var(--s50)}
  .btn.pri{background:var(--ink);color:var(--s50)}
  .btn.pri:disabled{opacity:.4;cursor:not-allowed}
  .dlg .x{position:absolute;right:16px;top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:70;font-size:13px;line-height:20px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  /* seletor de estados do protótipo */
  .proto{position:fixed;right:16px;top:14px;z-index:30;display:flex;align-items:center;gap:6px;font:500 11px/16px Inter;color:var(--mid);background:#fff;border:1px solid var(--s100);border-radius:999px;padding:3px 3px 3px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .proto button{padding:2px 8px;border-radius:999px;color:var(--mid)}
  .proto button.on{background:var(--ink);color:#fff}
</style>
</head>

  {st:'Faturada',pend:'—',tit:'Apex Comércio de Alimentos',uc:'5509871234 · Vale Norte Energia',ref:'fev/2025',resp:'Bruno Lima',dt:'10/03/2025'},
  {st:'Faturada',pend:'—',tit:'Zenith Serviços Médicos',uc:'3104567890 · Energia Serra',ref:'fev/2025',resp:'Ana Souza',dt:'09/03/2025'},
  {st:'Recusada',pend:'Não é fatura',tit:'Carlos Pereira',uc:'—',ref:'—',resp:'Bruno Lima',dt:'08/03/2025'},
  {st:'Duplicada',pend:'Já existe fev/2025',tit:'Veridian Elétrica',uc:'7712340987 · Força Sul',ref:'fev/2025',resp:'Bruno Lima',dt:'07/03/2025'}
].map((r,i)=>({...r,id:i}));
const S = {view:'carregando', q:'', sort:null, dir:1, fSt:null, sel:new Set(), menuRow:null};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>d.split('/').reverse().join('');

function toolsHTML(){
  return `<div class="tools">
    <div class="field grow"><span class="fbtn" aria-hidden="true"><span><span class="msr">search</span></span></span>
      <input id="q" placeholder="Buscar por titular, UC ou nome do arquivo" value="${esc(S.q)}" aria-label="Buscar faturas" autocomplete="off">
      <button class="fbtn" id="filt" aria-label="Filtrar por situação" aria-haspopup="menu"><span><span class="msr ${S.fSt?'fill':''}">filter_alt</span></span></button></div>
    <div class="field"><button class="fbtn" id="panel" aria-label="Painel lateral"><span><span class="msr">right_panel_close</span></span></button></div>
  </div>`;
}
function stateHTML(kind){
  if (kind==='carregando') return `<div class="state loading" aria-live="polite"><span class="msr spin">progress_activity</span><p>Carregando faturas</p></div>`;
  const msg = kind==='vazia' ? 'Ainda não há nenhuma fatura enviada para leitura' : 'Não foi encontrada nenhuma fatura para sua pesquisa.';
  return `<div class="state"><img src="assets/plug.svg" width="300" height="240" alt=""><p>${msg}</p></div>`;
}
function visibleRows(){
  let r = ROWS.filter(x=>!S.fSt || x.st===S.fSt);
  if (S.q){ const q=S.q.toLowerCase(); r=r.filter(x=>(x.tit+' '+x.uc).toLowerCase().includes(q)); }
  if (S.sort==='dt') r=r.slice().sort((a,b)=>S.dir*key(a.dt).localeCompare(key(b.dt)));
  if (S.sort==='st') r=r.slice().sort((a,b)=>S.dir*a.st.localeCompare(b.st,'pt'));
  return r;
}
function tableHTML(rows){
  const all = rows.length && rows.every(r=>S.sel.has(r.id));
  const sIco = k => S.sort===k ? (S.dir>0?'arrow_upward':'arrow_downward') : 'import_export';
  return `<div class="table" role="table" aria-label="Faturas">
    <div class="tr th" role="row">
      <div class="ck"><span class="cb ${all?'on':''}" id="ckAll" role="checkbox" aria-checked="${all}" aria-label="Selecionar todas">${all?'<span class="mss">check</span>':''}</span></div>
      <div class="sort"><button class="sbtn ${S.sort==='st'?'on':''}" data-sort="st"><span class="w">Situação</span><span class="msr">${sIco('st')}</span></button></div>
      <div>Pendências</div><div>Titular</div><div>UC</div><div>Referência</div><div>Responsável</div>
      <div class="sort"><button class="sbtn ${S.sort==='dt'?'on':''}" data-sort="dt"><span class="w">Recebida em</span><span class="msr">${sIco('dt')}</span></button></div>
      <div class="act"><button class="colbtn" id="colBtn" aria-label="Colunas"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9.74 3.833v.333H8.22v7.667h3.887v-1.5h.333v1.833H3.167V3.833H9.74zM3.5 11.833h4.38V4.166H3.5v7.667zm8.94-7.813v2h2v.333h-2v2h-.333v-2h-2v-.333h2v-2h.333z" fill="#0C0A09" stroke="#1C1917"/></svg></button></div>
    </div>
    ${rows.map(r=>`<div class="tr row ${S.sel.has(r.id)?'sel':''}" role="row" data-id="${r.id}" tabindex="0">
      <div class="td ck"><span class="cb ${S.sel.has(r.id)?'on':''}" data-ck="${r.id}" role="checkbox" aria-checked="${S.sel.has(r.id)}" aria-label="Selecionar ${esc(r.tit)}">${S.sel.has(r.id)?'<span class="mss">check</span>':''}</span></div>
      <div class="td"><span class="badge ${BADGE[r.st]}">${r.st}</span></div>
      <div class="td">${r.pend}</div>
      <div class="td"><span class="ent"><span class="bb"><span class="msr fill">bolt</span></span><span class="t">${esc(r.tit)}</span></span></div>
      <div class="td">${r.uc}</div><div class="td">${r.ref}</div><div class="td">${r.resp}</div><div class="td">${r.dt}</div>
      <div class="td act"><button class="more" data-more="${r.id}" aria-label="Ações" aria-haspopup="menu"><span class="mss">more_horiz</span></button></div>
    </div>`).join('')}
  </div>
  <div class="pag">
    <span class="info">${S.sel.size ? `${S.sel.size} de 454 faturas selecionada${S.sel.size>1?'s':''}` : '454 faturas'}</span>
    <div class="right">
      <span class="pc">Linhas por página <span class="combo">12 <span class="mss">unfold_more</span></span></span>
      <span class="pages">Página 1 de 38</span>
      <span class="pbtns"><button disabled aria-label="Primeira página"><span class="mss">first_page</span></button><button disabled aria-label="Página anterior"><span class="mss">chevron_left</span></button><button data-next aria-label="Próxima página"><span class="mss">chevron_right</span></button><button data-next aria-label="Última página"><span class="mss">last_page</span></button></span>
    </div>
  </div>`;
}
function render(){
  closeMenus();
  const b = $('#body');
  if (S.view==='vazia'){ b.innerHTML = stateHTML('vazia'); return; }
  if (S.view==='carregando'){ b.innerHTML = toolsHTML() + stateHTML('carregando'); bindTools(); return; }
  const rows = visibleRows();
  b.innerHTML = toolsHTML() + (rows.length ? tableHTML(rows) : stateHTML('busca'));
  bindTools();
}
function bindTools(){
  const q=$('#q'); if(!q) return;
  q.oninput = e=>{ S.q=e.target.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#filt').onclick = e=>{ e.stopPropagation(); openFilter(e.currentTarget); };
  $('#panel').onclick = ()=>toast('Painel lateral fora do escopo do protótipo.');
}
/* menus */
function place(dd, btn){ const r=btn.getBoundingClientRect(); dd.hidden=false; dd.style.top=(window.scrollY+r.bottom+4)+'px'; dd.style.left=(window.scrollX+r.right-dd.offsetWidth)+'px'; }
function closeMenus(){ $('#dd').hidden=true; $('#fd').hidden=true; document.querySelectorAll('.more.open').forEach(b=>b.classList.remove('open')); S.menuRow=null; }
function openRowMenu(btn,id){ closeMenus(); S.menuRow=id; btn.classList.add('open'); place($('#dd'),btn); $('#dd button').focus(); }
function openFilter(btn){ const open=!$('#fd').hidden; closeMenus(); if(open) return;
  const opts=['Todas as situações',...Object.keys(BADGE)];
  $('#fdSec').innerHTML = opts.map(o=>{ const v=o==='Todas as situações'?'':o; const on=(S.fSt||'')===v; return `<button data-f="${v}">${on?'<span class="mss">check</span>':''}${o}</button>`; }).join('');
  place($('#fd'),btn); }
$('#fd').addEventListener('click',e=>{ const b=e.target.closest('[data-f]'); if(!b) return; S.fSt=b.dataset.f||null; S.sel.clear(); render(); });
$('#dd').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const r=ROWS[S.menuRow]; const a=b.dataset.a; closeMenus();
  if(a==='revisar') open(r);
  if(a==='atribuir'){ r.resp='Você'; render(); toast(`Fatura de ${r.tit} atribuída a você.`); }
  if(a==='recusar') openDlg(r); });
/* abrir detalhe */
function open(r){ if(r.demo) location.href='detalhe.html'; else toast('No protótipo, só a fatura da Padaria Estrela do Sul abre o detalhe.'); }
/* tabela: cliques */
$('#body').addEventListener('click',e=>{
  const more=e.target.closest('[data-more]'); if(more){ e.stopPropagation(); if(more.classList.contains('open')) closeMenus(); else openRowMenu(more,+more.dataset.more); return; }
  const ck=e.target.closest('[data-ck]'); if(ck){ const id=+ck.dataset.ck; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); return; }
  if(e.target.closest('#ckAll')){ const rows=visibleRows(); const all=rows.every(r=>S.sel.has(r.id)); rows.forEach(r=>all?S.sel.delete(r.id):S.sel.add(r.id)); render(); return; }
  const s=e.target.closest('[data-sort]'); if(s){ const k=s.dataset.sort; if(S.sort===k){ if(S.dir===1) S.dir=-1; else { S.sort=null; S.dir=1; } } else { S.sort=k; S.dir=k==='dt'?-1:1; } render(); return; }
  if(e.target.closest('[data-next]')){ toast('Só a primeira página tem dados no protótipo.'); return; }
  if(e.target.closest('#colBtn')){ toast('Seleção de colunas fora do escopo do protótipo.'); return; }
  const row=e.target.closest('.row'); if(row) open(ROWS[+row.dataset.id]);
});
$('#body').addEventListener('keydown',e=>{ const row=e.target.closest('.row'); if(row && e.key==='Enter' && e.target===row) open(ROWS[+row.dataset.id]); });
document.addEventListener('click',e=>{ if(!e.target.closest('.dd')) closeMenus(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMenus(); closeDlg(); } });
/* modal recusar */
let dlgRow=null;
function openDlg(r){ dlgRow=r; $('#dlgD').textContent = `A fatura de ${r.tit}${r.uc!=='—'?` (UC ${r.uc.split(' · ')[0]}, ${r.ref})`:''} não será faturada. Informe o motivo para quem consultar depois.`; $('#motivo').value=''; $('#obs').value=''; $('#confirm').disabled=true; $('#ov').classList.add('show'); window.csRefresh&&csRefresh(); ($('#motivo').closest('.cs')?.querySelector('.cs-trig')||$('#motivo')).focus(); }
function closeDlg(){ $('#ov').classList.remove('show'); dlgRow=null; }
$('#motivo').onchange=()=>{ $('#confirm').disabled=!$('#motivo').value; };
$('#cancel').onclick=closeDlg; $('#close').onclick=closeDlg;
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeDlg(); });
$('#dlg').onsubmit=e=>{ e.preventDefault(); const r=dlgRow; const m=$('#motivo').value; r.st='Recusada'; r.pend=m.replace('Não é fatura de energia','Não é fatura'); closeDlg(); render(); toast(`Fatura de ${r.tit} recusada.`); };
/* estados do protótipo */
document.querySelectorAll('.proto [data-st]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.proto [data-st]').forEach(x=>x.classList.toggle('on',x===b)); S.view=b.dataset.st; render(); if(S.view==='carregando') setTimeout(()=>{ if(S.view==='carregando'){ S.view='lista'; syncProto(); render(); } },1400); });
function syncProto(){ document.querySelectorAll('.proto [data-st]').forEach(x=>x.classList.toggle('on',x.dataset.st===S.view)); }
$('#add').onclick=()=>toast('Envio de fatura fora do escopo do protótipo.');
/* tooltips da barra lateral */
const tip=$('#sbTip');
document.querySelectorAll('.sidebar [data-tip]').forEach(a=>{ a.setAttribute('aria-label',a.dataset.tip);
  a.addEventListener('mouseenter',()=>{ const r=a.getBoundingClientRect(); tip.textContent=a.dataset.tip; tip.style.top=(r.top+r.height/2-14)+'px'; tip.style.opacity=1; });
  a.addEventListener('mouseleave',()=>tip.style.opacity=0);
  if(!a.classList.contains('on')) a.addEventListener('click',e=>{ e.preventDefault(); toast(`${a.dataset.tip} fora do escopo do protótipo.`); });
});
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
/* carga inicial */
syncProto(); render(); setTimeout(()=>{ S.view='lista'; syncProto(); render(); }, 900);
</script>
<script src="assets/select.js"></script>
</body>
</html>
