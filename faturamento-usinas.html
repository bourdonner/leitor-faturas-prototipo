.dw .dwf{padding:16px 24px 24px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--fsec)}\n@media (prefers-reduced-motion:reduce){.fp .dw,.fp .dw-ov{transition:none}}\n.fp .two>.bdg{align-self:flex-start}\n.fp .kvl b.al{color:var(--alert)}\n\n/* etapa: 3 segmentos (leitura · estudo · conta a receber), como na v1 */\n.fp .steps{display:flex;align-items:center;gap:3px;flex:none}\n.fp .steps i{width:18px;height:6px;border-radius:999px;background:var(--fsec)}\n.fp .two.eta{gap:6px}\n.fp .steps i.d{background:var(--success)} .fp .steps i.c{background:var(--ink)} .fp .steps i.e{background:var(--danger)}\n\n/* resumo: seções recolhíveis (mesmo padrão .pnl.closed do fp.css) */\n.fp .stg .ib{margin-right:-4px}\n.fp .act-p .chev{transition:transform .2s}\n.fp .act-p.closed .chev{transform:rotate(180deg)}\n.fp .act-p.closed .cmp{display:none}\n.fp .act-p.closed .act-h{padding-bottom:16px}\n\n/* ===== Figma 30/10: tabela (Estudo → Etapa → Status) e resumo em cards ===== */\n/* etapa: 3 pontos de 8px (Figma \"Etapa / Pontos\") + nome em 12px */\n.fp .steps{gap:6px}\n.fp .steps i{width:8px;height:8px;border-radius:50%;background:var(--border)}\n.fp .steps i.d{background:var(--brand)} .fp .steps i.c{background:var(--ink3)} .fp .steps i.e{background:var(--danger)}\n.fp .two.eta>span:last-child{font-size:12px;line-height:16px;color:var(--mid)}\n/* titular e UC na caixa de entidade */\n.fp .tr.row>div.cel{padding:0 8px}\n.fp .tr.row>div.cel .ent{flex:1;min-height:49px;padding:4px 8px}\n\n/* resumo: cards */\n.fp .rs-card{background:var(--hov2);border-radius:12px;overflow:clip}\n.fp .rs-hd{display:flex;align-items:center;gap:12px;padding:24px}\n.fp .rs-hd .eb{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--fg);display:grid;place-items:center;flex:none}\n.fp .rs-hd .eb.off{background:var(--border)}\n.fp .rs-hd .eb .msr{font-size:18px}\n.fp .rs-hd .t{flex:1;min-width:0;display:flex;flex-direction:column}\n.fp .rs-hd .t b{font:700 16px/24p px}\n.fp.dk .rs-rev{color:#0c0a09}\n.fp .rs-tk{display:flex;flex-direction:column;gap:8px;padding:16px 24px 24px}\n.fp .rs-tk .row{display:flex;align-items:center;gap:8px}\n.fp .rs-tk .row b{flex:1;font:700 16px/24px Inter,sans-serif}\n.fp .b.sec{background:var(--sec);color:var(--ink);font-weight:400} .fp .b.sec:hover{background:var(--fg)}\n.fp .rs-card .b.pri{font-weight:400}\n/* comentários com o mesmo respiro dos cards do resumo (24px) */\n.fp .act-p{border-radius:12px}\n.fp .act-p .act-h{padding:24px 24px 16px;gap:12px;font-size:14px;line-height:24px}\n.fp .act-p .act-l{padding:0 24px 16px}\n.fp .cmp{padding:0 24px 24px}\n.fp .act-p.closed .act-h{padding-bottom:24px}\n\n/* resumo: o cabeçalho de cada seção gruda no topo (abaixo da barra) até a seção acabar;\n   cantos de 12px mascarados e um degradê embaixo para o conteúdo sumir suave */\n.fp .rs-hd,.fp .act-p .act-h{position:sticky;top:0;z-index:1;background:var(--fg)}\n.fp .rs-hd::before,.fp .act-p .act-h::before{content:\"\";position:absolute;inset:0;background:var(--hov2);border-radius:12px 12px 0 0;z-index:-1}\n.fp .rs-hd::after,.fp .act-p .act-h::after{content:\"\";position:absolute;left:0;right:0;top:100%;height:20px;background:linear-gradient(var(--hov2),transparent);pointer-events:none;opacity:0;transition:opacity .12s}\n.fp .rs-hd.stuck::after,.fp .act-p .act-h.stuck::after{opacity:1}\n.fp .act-p{overflow:clip}\n.fp .rs-hd .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n/* triagem stg (03/11): ações em lote por status, filtros extras, observação ao arquivar */\n.fp .bulk{flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 48px)}\n.fp .bulk .bulk-a{display:contents}\n.fp .bulk .b.dis{opacity:.4;cursor:not-allowed}\n.fp .bulk .b.dg:not(.dis){color:var(--danger)}\n.fp .flt.more-f{border-style:dashed;background:transparent;color:var(--mid)}\n.fp .flt.more-f .lb{color:var(--mid)}\n.fp .pop .obs{display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px}\n.fp
